<script>
const W=600,H=760,S=2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(1);const seed=s=>R=mulberry32(s);const rnd=(a=0,b=1)=>a+(b-a)*R();
function mk(){const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);x.lineCap='round';x.lineJoin='round';return[c,x]}

const P2=s=>new Path2D(s);
function hx(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function shade(h,f){return'#'+hx(h).map(v=>Math.round(f<0?v*(1+f):v+(255-v)*f).toString(16).padStart(2,'0')).join('')}
function rr(x,y,w,h,r){return`M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`}
function ell(cx,cy,rx,ry,rot=0){const p=new Path2D();p.ellipse(cx,cy,rx,ry,rot,0,Math.PI*2);return p}

function pencil(g,path,{w=1,a=.55,passes=3,col='#2a2420'}={}){for(let i=0;i<passes;i++){g.save();g.translate(rnd(-1.2,1.2),rnd(-1.2,1.2));g.strokeStyle=col;g.lineWidth=w*rnd(.6,1.3);g.globalAlpha=a*rnd(.5,1);g.setLineDash([rnd(30,120),rnd(1,5),rnd(10,60),rnd(1,3)]);g.lineDashOffset=rnd(0,100);g.stroke(path);g.restore()}}
function hatch(g,path,bb,{ang=.6,gap=4,a=.35,w=.7,col='#2a2420',wob=1.6}={}){g.save();g.clip(path);const cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2,d=Math.hypot(bb[2]-bb[0],bb[3]-bb[1])/2+10;g.translate(cx,cy);g.rotate(ang);g.strokeStyle=col;for(let y=-d;y<d;y+=gap*rnd(.7,1.3)){g.beginPath();const s=-d+rnd(0,d*.25),e=d-rnd(0,d*.25);g.moveTo(s,y+rnd(-wob,wob));g.quadraticCurveTo((s+e)/2,y+rnd(-wob,wob),e,y+rnd(-wob,wob));g.lineWidth=w*rnd(.6,1.4);g.globalAlpha=a*rnd(.4,1);g.stroke()}g.restore()}
function erase(g,path){g.save();g.globalCompositeOperation='destination-out';g.globalAlpha=1;g.fill(path);g.restore()}

function daisyPos(){seed(55);const p=[];for(let y=525,r=0;y<760;y+=52,r++)for(let x=150+(r%2)*30;x<470;x+=60)p.push([x+rnd(-8,8),y+rnd(-8,8),rnd(0,6)]);return p}

function eyeP(cx){return P2(`M${cx-25} 292 C${cx-17} 274 ${cx+15} 272 ${cx+25} 290 C${cx+15} 304 ${cx-15} 306 ${cx-25} 292 Z`)}

G.save();G.clip(body);for(const[x,y,r]of daisyPos())pencil(G,petals(x,y,r),{w:.7,a:.45,passes:2});G.restore();
G.save();G.clip(body);[[220,600,240,760],[300,520,305,760],[380,600,362,760]].forEach(f=>pencil(G,P2(`M${f[0]} ${f[1]} Q${(f[0]+f[2])/2+8} ${(f[1]+f[3])/2} ${f[2]} ${f[3]}`),{w:.8,a:.35,passes:2}));G.restore();
pencil(G,body,{w:1.3,a:.7});
erase(G,neck);hatch(G,neckSh,[260,380,340,440],{ang:.3,gap:2.6,a:.35});pencil(G,neck,{w:1,a:.6});
erase(G,collar);hatch(G,P2('M232 456 C252 480 290 490 300 478 L300 466 C280 468 258 470 232 456Z'),[230,450,370,500],{ang:-.3,gap:3,a:.15});pencil(G,collar,{w:1,a:.65});
for(const[p,f,t]of[[lockL,[200,272,224],[182,490,222]],[lockR,[376,272,400],[378,490,418]]]){erase(G,p);hatch(G,p,[180,265,420,490],{ang:1.4,gap:3.2,a:.25});strands(G,p,30,f,t);pencil(G,p,{w:1.1,a:.7})}
erase(G,face);hatch(G,faceShR,[300,225,402,406],{ang:-.7,gap:3,a:.2});G.save();G.clip(face);hatch(G,faceShTop,[200,200,402,285],{ang:.8,gap:2.8,a:.24});G.restore();
hatch(G,ell(240,332,22,11),[215,318,265,346],{ang:-.6,gap:2.5,a:.1});hatch(G,ell(360,332,22,11),[335,318,385,346],{ang:-.6,gap:2.5,a:.1});
pencil(G,face,{w:1.1,a:.65});
for(const[cx,fl]of[[259,-1],[341,1]]){const e=eyeP(cx),ir=ell(cx,291,12.5,12.5);G.save();G.clip(e);hatch(G,ir,[cx-14,277,cx+14,305],{ang:.9,gap:1.8,a:.45});hatch(G,ir,[cx-14,277,cx+14,305],{ang:-.7,gap:2.6,a:.25});G.fillStyle='#1d1814';G.globalAlpha=.88;G.fill(ell(cx,291,5.5,6));G.globalAlpha=1;pencil(G,ir,{w:.8,a:.6,passes:2});G.restore();
erase(G,ell(cx+4,286,3.6,3.6));erase(G,ell(cx-4,296,1.6,1.6));
pencil(G,P2(`M${cx-25} 292 C${cx-17} 274 ${cx+15} 272 ${cx+25} 290`),{w:2.8,a:.85,passes:4});
pencil(G,P2(`M${cx-21} 297 C${cx-11} 305 ${cx+11} 305 ${cx+21} 296`),{w:.8,a:.35,passes:2});
const o=cx+fl*25;pencil(G,P2(`M${o-fl} 290 L${o+fl*9} 282 M${o-fl*5} 284 L${o+fl*3} 274 M${o-fl*11} 279 L${o-fl*6} 270`),{w:1.4,a:.75,passes:2})}
pencil(G,P2('M232 268 C245 257 268 256 283 262'),{w:2.6,a:.55,passes:4});pencil(G,P2('M317 262 C332 256 355 257 368 268'),{w:2.6,a:.55,passes:4});
pencil(G,P2('M301 306 C296 322 297 332 307 333'),{w:1,a:.55});hatch(G,ell(296,326,6,8),[288,316,304,336],{ang:.6,gap:2,a:.18});
hatch(G,mouth,[278,348,324,370],{ang:.3,gap:2.4,a:.2});pencil(G,mouth,{w:1.2,a:.75});pencil(G,P2('M272 345 C275 349 278 350 280 349 M330 345 C327 349 324 350 322 349'),{w:.9,a:.5,passes:2});
seed(31);for(let i=0;i<14;i++){const x=(i%2?rnd(340,380):rnd(220,260)),y=rnd(312,334);G.globalAlpha=.4;G.fillStyle='#3a2a20';G.beginPath();G.arc(x,y,rnd(.8,1.6),0,7);G.fill()}G.globalAlpha=1;
erase(G,bangs);hatch(G,bangs,[198,154,404,272],{ang:1.4,gap:3.2,a:.24});strands(G,bangs,70,[285,160,315],[200,262,404]);pencil(G,bangs,{w:1.2,a:.75});
erase(G,band);hatch(G,band,[176,124,424,262],{ang:.2,gap:2.6,a:.3});pencil(G,band,{w:1.1,a:.7});
for(const[c,p]of[[cupL,padL],[cupR,padR]]){erase(G,c);hatch(G,c,[160,230,440,316],{ang:-.9,gap:2.6,a:.32});hatch(G,c,[160,230,440,316],{ang:.6,gap:4,a:.18});pencil(G,c,{w:1.2,a:.75});hatch(G,p,[190,244,410,304],{ang:1.4,gap:1.8,a:.5});pencil(G,p,{w:.8,a:.6,passes:2})}
erase(G,ell(176,252,4,9,-.3));erase(G,ell(404,252,4,9,-.3));
for(const n of[noteHead1,noteHead2]){hatch(G,n,[470,90,545,215],{ang:.8,gap:1.8,a:.6});pencil(G,n,{w:1,a:.7,passes:2})}pencil(G,noteLines,{w:1.6,a:.7,passes:3});
}
const pal={hair:'#c8742f',dress:'#e8b23f',phones:'#7f6ad8'};
function buildC(){seed(13);C.clearRect(0,0,W,H);
crayon(C,halo,[60,40,540,660],'#d9cff6',{ang:-.9,a:.18,w:4,base:.18,edge:0});
const hs=shade(pal.hair,-.35);
erase(C,hairBack);crayon(C,hairBack,[140,115,460,605],pal.hair,{ang:1.3,w:3});crayon(C,ell(300,420,150,140),[150,280,450,560],shade(pal.hair,-.45),{ang:1.3,base:.25,a:.25,edge:0});
erase(C,body);crayon(C,body,[115,450,485,760],pal.dress,{ang:.25,w:3.4});crayon(C,bodyShL,[110,440,220,760],shade(pal.dress,-.18),{ang:.9,base:.18,a:.2,edge:0});crayon(C,bodyShR,[380,440,490,760],shade(pal.dress,-.18),{ang:-.9,base:.18,a:.2,edge:0});
C.save();C.clip(body);for(const[x,y,r]of daisyPos()){erase(C,petals(x,y,r));C.fillStyle='#e0841f';C.globalAlpha=.85;C.beginPath();C.arc(x,y,3.6,0,7);C.fill();C.globalAlpha=1}C.restore();
erase(C,neck);crayon(C,neck,[260,380,340,465],'#f2c3a6',{ang:.3,w:2.5});crayon(C,neckSh,[260,380,340,440],'#d98a72',{ang:.3,base:.35,edge:0});
erase(C,collar);crayon(C,P2('M232 456 C252 480 290 490 300 478 L300 466 C280 468 258 470 232 456Z'),[230,450,370,500],'#c9cbe2',{base:.25,edge:0});
for(const p of[lockL,lockR]){erase(C,p);crayon(C,p,[180,265,420,490],pal.hair,{ang:1.45,w:2.6})}
erase(C,face);crayon(C,face,[198,166,402,406],'#f6d2bb',{ang:-.6,w:2.6,a:.22,edge:.18});crayon(C,faceShR,[300,225,402,406],'#e6a088',{ang:-.7,base:.3,a:.2,edge:0});C.save();C.clip(face);crayon(C,faceShTop,[200,200,402,285],'#e6a088',{ang:.8,base:.3,a:.2,edge:0});C.restore();
crayon(C,ell(240,332,22,12),[215,318,265,346],'#f07f98',{ang:-.6,base:.3,a:.25,w:2,edge:0});crayon(C,ell(360,332,22,12),[335,318,385,346],'#f07f98',{ang:-.6,base:.3,a:.25,w:2,edge:0});
for(const cx of[259,341]){C.save();C.clip(eyeP(cx));crayon(C,ell(cx,291,12.5,12.5),[cx-14,277,cx+14,305],'#2f9a7f',{ang:.9,w:1.6,base:.6,edge:.3});C.restore();erase(C,ell(cx+4,286,3.6,3.6))}

seed(31);for(let i=0;i<14;i++){const x=(i%2?rnd(340,380):rnd(220,260)),y=rnd(312,334);C.globalAlpha=.5;C.fillStyle='#b5683f';C.beginPath();C.arc(x,y,rnd(1.2,2.2),0,7);C.fill()}C.globalAlpha=1;

C.save();C.globalAlpha=.6;C.strokeStyle=shade(pal.hair,.55);C.lineWidth=5;C.setLineDash([22,10,40,12]);C.stroke(P2('M240 190 C265 170 300 166 330 172'));C.stroke(P2('M180 330 C176 380 172 420 170 470'));C.restore();

function buildPaper(){const g=P.createRadialGradient(300,360,120,300,380,520);g.addColorStop(0,'#fbf6ea');g.addColorStop(1,'#eadfc9');P.fillStyle=g;P.fillRect(0,0,W,H);
const id=Gr.createImageData(W*S,H*S),d=id.data;for(let i=0;i<d.length;i+=4){const v=255-Math.pow(Math.random(),5)*90-Math.random()*10;d[i]=v;d[i+1]=v-2;d[i+2]=v-6;d[i+3]=255}Gr.putImageData(id,0,0);
seed(5);Gr.strokeStyle='#cfc2aa';for(let i=0;i<120;i++){Gr.globalAlpha=rnd(.1,.3);Gr.lineWidth=rnd(.3,.7);const x=rnd(0,W),y=rnd(0,H),a=rnd(0,7),l=rnd(4,14);Gr.beginPath();Gr.moveTo(x,y);Gr.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);Gr.stroke()}Gr.globalAlpha=1}
function masked(src,mask){T.setTransform(1,0,0,1,0,0);T.globalCompositeOperation='source-over';T.globalAlpha=1;T.clearRect(0,0,Tc.width,Tc.height);T.drawImage(src,0,0);T.globalCompositeOperation='destination-in';T.drawImage(mask,0,0);T.globalCompositeOperation='source-over';return Tc}
function compose(){o.globalCompositeOperation='source-over';o.globalAlpha=1;o.drawImage(Pc,0,0);o.globalCompositeOperation='multiply';o.drawImage(masked(Cc,Mc),0,0);o.drawImage(masked(Gc,MGc),0,0);o.globalAlpha=.55;o.drawImage(Grc,0,0);o.globalAlpha=1;o.globalCompositeOperation='source-over'}
let anim=0;
function animateMask(m,dur,dir,cb){const id=++anim;m.globalAlpha=1;m.clearRect(0,0,W,H);const r=mulberry32(99+dir),t0=performance.now();m.strokeStyle='#000';
function f(now){if(id!==anim)return;const p=Math.min(1,(now-t0)/dur),band=p*(H+160)-80;for(let i=0;i<55;i++){const x=r()*W,y=band+(r()-.5)*160,s=r()-.5;m.beginPath();m.moveTo(x-50,y-12*s);m.lineTo(x+50+r()*40,y+12*s);m.lineWidth=18+r()*36;m.globalAlpha=.45;m.stroke()}compose();if(p<1)requestAnimationFrame(f);else{m.globalAlpha=1;m.fillStyle='#000';m.fillRect(0,0,W,H);compose();cb&&cb()}}requestAnimationFrame(f)}
let colored=false;
function colorIn(){colored=true;animateMask(M,2400,1)}
function toSilhouette(){colored=false;anim++;M.clearRect(0,0,W,H);compose()}
const sets={hair:['#c8742f','#3b2a22','#e8c36a','#b8432f','#8a6ad0'],dress:['#e8b23f','#e0708e','#5fa8d8','#6dbb7c','#f2efe6'],phones:['#7f6ad8','#e0607a','#2f9a7f','#3a3a40']};
for(const k in sets){const box=document.getElementById(k);sets[k].forEach(c=>{const s=document.createElement('span');s.className='sw'+(c===pal[k]?' on':'');s.style.background=c;s.style.display='inline-block';s.style.marginRight='8px';s.onclick=()=>{pal[k]=c;[...box.children].forEach(e=>e.classList.remove('on'));s.classList.add('on');buildC();if(colored)compose();else colorIn()};box.appendChild(s)})}
document.getElementById('go').onclick=colorIn;document.getElementById('back').onclick=toSilhouette;
buildPaper();buildG();buildC();animateMask(MG,1600,0);
</script></body></html>
